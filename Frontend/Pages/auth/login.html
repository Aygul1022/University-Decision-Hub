<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · University Decision Hub</title>
  <link rel="stylesheet" href="../../css/shared/global.css">
  <link rel="stylesheet" href="../../css/shared/navbar.css">
  <link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-lead">Read every course review and share your own.</p>

      <p class="notice" data-next-notice hidden>Log in to continue to the page you asked for.</p>

      <form data-auth-form="login" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
          <p class="field-error" data-error-for="email"></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <p class="field-error" data-error-for="password"></p>
        </div>

        <p class="form-message" data-form-message role="alert" hidden></p>

        <button type="submit" class="button">Log in</button>
      </form>

      <p class="auth-switch">No account yet? <a href="register.html" data-keep-next>Create one</a></p>
    </div>
  </main>

  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/navbar.js"></script>
  <script src="../../js/pages/auth.js"></script>
</body>
</html>
