<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile · University Decision Hub</title>
  <link rel="stylesheet" href="../../css/shared/global.css">
  <link rel="stylesheet" href="../../css/shared/navbar.css">
  <link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <h1>My profile</h1>
      <p class="auth-lead">Your department and year decide which courses you can review. Keep them up to date.</p>

      <p class="notice" data-status role="status">Loading your profile…</p>

      <form data-profile-form novalidate hidden>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" readonly aria-describedby="email-hint">
          <p class="field-hint" id="email-hint">Your email cannot be changed here. Ask an administrator if it is wrong.</p>
        </div>

        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="150" required>
          <p class="field-error" data-error-for="fullName"></p>
        </div>

        <div class="field-row">
          <div class="field">
            <!-- Becomes a department list once the Departments endpoint exists. -->
            <label for="departmentId">Department number</label>
            <input id="departmentId" name="departmentId" type="number" min="1" step="1" inputmode="numeric" required>
            <p class="field-error" data-error-for="departmentId"></p>
          </div>

          <div class="field">
            <label for="studyYear">Year of study</label>
            <select id="studyYear" name="studyYear" required>
              <option value="1">1st year</option>
              <option value="2">2nd year</option>
              <option value="3">3rd year</option>
              <option value="4">4th year</option>
              <option value="5">5th year</option>
              <option value="6">6th year</option>
            </select>
            <p class="field-error" data-error-for="studyYear"></p>
          </div>
        </div>

        <p class="form-message" data-form-message role="alert" hidden></p>

        <button type="submit" class="button">Save changes</button>
      </form>
    </div>
  </main>

  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/navbar.js"></script>
  <script src="../../js/pages/profile.js"></script>
</body>
</html>
