<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My profile · University Decision Hub</title>
  <link rel="stylesheet" href="../../css/shared/global.css">
  <link rel="stylesheet" href="../../css/shared/navbar.css">
  <link rel="stylesheet" href="../../css/pages/auth.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card profile-card">
      <h1>My profile</h1>
      <p class="auth-lead">Your programme and year decide which courses you can review. Keep them up to date.</p>

      <p class="notice" data-status role="status">Loading your profile…</p>

      <section aria-label="Saved profile" data-profile-summary hidden>
        <dl class="profile-details">
          <div><dt>Full name</dt><dd data-profile-value="fullName"></dd></div>
          <div><dt>Email</dt><dd data-profile-value="email"></dd></div>
          <div><dt>Department</dt><dd data-profile-value="department"></dd></div>
          <div><dt>Programme</dt><dd data-profile-value="programme"></dd></div>
          <div><dt>Year of study</dt><dd data-profile-value="studyYear"></dd></div>
        </dl>
        <button type="button" class="button" data-profile-edit>Edit profile</button>
      </section>

      <form data-profile-form novalidate hidden>
        <fieldset class="profile-edit-fields">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" readonly aria-describedby="email-hint">
            <p class="field-hint" id="email-hint">Your email cannot be changed here. Ask an administrator if it is wrong.</p>
          </div>

          <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="150" required>
            <p class="field-error" data-error-for="fullName"></p>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="departmentId">Department</label>
              <select id="departmentId" name="departmentId" aria-describedby="department-hint">
                <option value="">Not a student</option>
              </select>
              <p class="field-hint" id="department-hint" data-department-hint role="status"></p>
              <button class="button secondary profile-retry" type="button" data-department-retry hidden>Retry departments</button>
              <p class="field-error" data-error-for="departmentId"></p>
            </div>

            <div class="field">
              <label for="studyYear">Year of study</label>
              <select id="studyYear" name="studyYear">
                <option value="">Not a student</option>
                <option value="1">1st year</option>
                <option value="2">2nd year</option>
                <option value="3">3rd year</option>
                <option value="4">4th year</option>
                <option value="5">5th year</option>
                <option value="6">6th year</option>
                <!-- Sent as isGraduate: true with no study year. -->
                <option value="graduate">Graduate</option>
              </select>
              <p class="field-error" data-error-for="studyYear"></p>
            </div>
          </div>

          <div class="field">
            <!-- Options are added from GET /api/programmes?departmentId=... for the chosen department. -->
            <label for="programmeId">Programme</label>
            <select id="programmeId" name="programmeId" aria-describedby="programme-hint">
              <option value="">Not selected</option>
            </select>
            <p class="field-hint" id="programme-hint" data-programme-hint role="status"></p>
            <button class="button secondary profile-retry" type="button" data-programme-retry hidden>Retry programmes</button>
            <p class="field-error" data-error-for="programmeId"></p>
          </div>

          <p class="form-message" data-form-message role="alert" hidden></p>

          <div class="profile-actions">
            <button type="submit" class="button">Save changes</button>
            <button type="button" class="button secondary" data-profile-cancel>Cancel</button>
          </div>
        </fieldset>
      </form>
    </div>
  </main>

  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/navbar.js"></script>
  <script src="../../js/pages/profile.js"></script>
</body>
</html>
