<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Read Reviews · University Decision Hub</title>
  <link rel="stylesheet" href="../../css/shared/global.css">
  <link rel="stylesheet" href="../../css/shared/navbar.css">
  <link rel="stylesheet" href="../../css/pages/reviews.css">
</head>
<body>
  <main class="page reviews-page">
    <h1>Read Reviews</h1>
    <form class="card review-filters" aria-label="Review filters">
      <p data-course-scope hidden>Showing reviews for the selected course. Clear filters to search all courses.</p>
      <div class="review-filter-fields">
        <label>Course code
          <input name="courseCode" placeholder="e.g. COME 327" maxlength="64">
        </label>
        <label>Course department
          <select name="departmentId"><option value="">All departments</option></select>
        </label>
        <label>Instructor
          <select name="instructorId"><option value="">All instructors</option></select>
        </label>
        <label>Academic year
          <input name="academicYear" placeholder="YYYY-YYYY" pattern="[0-9]{4}-[0-9]{4}" maxlength="9" title="Enter an academic year in YYYY-YYYY format">
        </label>
        <label>Semester
          <select name="semester">
            <option value="">All semesters</option>
            <option value="Fall">Fall</option>
            <option value="Spring">Spring</option>
            <option value="Summer">Summer</option>
          </select>
        </label>
      </div>
      <p class="review-catalog-status" data-catalog-status role="status" hidden></p>
      <div class="review-filter-actions">
        <button class="button" type="submit">Search reviews</button>
        <a href="reviews.html">Clear filters</a>
      </div>
    </form>

    <section aria-labelledby="review-results-title">
      <h2 id="review-results-title">Reviews</h2>
      <p class="notice" data-review-status role="status">Loading reviews…</p>
      <div class="review-results" data-review-results></div>
      <nav class="review-pagination" aria-label="Review pages" hidden>
        <a class="button secondary" data-previous-page>Previous</a>
        <span data-page-number></span>
        <a class="button secondary" data-next-page>Next</a>
      </nav>
    </section>

    <dialog class="card review-dialog" aria-labelledby="review-dialog-title">
      <form method="dialog">
        <button class="button secondary" autofocus>Close</button>
      </form>
      <h2 id="review-dialog-title">Review detail</h2>
      <p class="review-context" data-detail-context hidden></p>
      <p class="notice" data-detail-status role="status"></p>
      <p class="review-text" data-detail-text hidden></p>
    </dialog>
  </main>
  <script src="../../js/shared/api.js"></script>
  <script src="../../js/shared/navbar.js"></script>
  <script src="../../js/pages/reviews.js"></script>
</body>
</html>
